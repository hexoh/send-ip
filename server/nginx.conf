# Server-side Nginx reverse proxy config
# Place it at /etc/nginx/sites-available/send-ip, symlink it into sites-enabled,
# then replace ip.example.com with your own domain.
# Sign the HTTPS certificate with certbot: sudo certbot --nginx -d ip.example.com
# certbot will insert ssl_certificate and related settings into this file automatically.

server {
    listen 80;
    listen [::]:80;
    server_name ip.example.com;

    # Give the reporting endpoint a bit more room; keep the defaults elsewhere
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Do not log health checks to avoid noisy logs
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
    }
}
