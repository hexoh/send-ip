name: Release

# Tagging publishes a release: pushing a tag like v1.2.3 triggers packaging + GitHub Release creation.
# Local release: python3 tools/release.py 1.2.3

on:
  push:
    tags:
      - 'v[0-9]*'
  # Manual re-run: after fixing packaging issues, rebuild attachments for an existing tag and overwrite the same-named Release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (e.g. v1.0.0)'
        required: true
        type: string

run-name: Release ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

# Only one job per tag at a time, to avoid concurrent attachment overwrites
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: meta
        env:
          RAW_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RAW_REF#refs/tags/}"
          tag="${tag#v}"
          tag="v${tag}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '${tag}' does not match the vX.Y.Z or vX.Y.Z-rc1 format"
            exit 1
          fi

          version="${tag#v}"
          echo "tag=${tag}"           >> "$GITHUB_OUTPUT"
          echo "version=${version}"   >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true"    >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false"   >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing version ${version}"

      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag points to the current commit
        env:
          EXPECTED: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tagged="$(git rev-list -n 1 "$EXPECTED")"
          echo "tag ${EXPECTED} -> ${tagged}"
          echo "checkout       -> ${actual}"
          test "$actual" = "$tagged"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: python3 build.py --tar --version "$VERSION"

      - name: Validate artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for pkg in send-ip-server send-ip-client; do
            tar_file="dist/${pkg}.tar.gz"
            test -f "$tar_file" || { echo "::error::missing $tar_file"; exit 1; }
            # Bundled version must match the tag
            echo "--- ${pkg} contents ---"
            tar -tzf "$tar_file"
            packaged="$(tar -xzOf "$tar_file" "${pkg}/VERSION" | tr -d '\r\n')"
            if [ "$packaged" != "$VERSION" ]; then
              echo "::error::${pkg} bundled version ${packaged} != tag version ${VERSION}"
              exit 1
            fi
          done

          # Key files must actually be in the bundle (guard against a broken build.py manifest)
          tar -tzf dist/send-ip-server.tar.gz | grep -qx 'send-ip-server/app.py'
          tar -tzf dist/send-ip-server.tar.gz | grep -qx 'send-ip-server/templates/index.html'
          tar -tzf dist/send-ip-server.tar.gz | grep -qx 'send-ip-server/requirements.txt'
          tar -tzf dist/send-ip-client.tar.gz | grep -qx 'send-ip-client/index.py'
          tar -tzf dist/send-ip-client.tar.gz | grep -qx 'send-ip-client/requirements.txt'
          echo "Artifact validation passed"

      - name: Version file names and generate checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mv dist/send-ip-server.tar.gz "dist/send-ip-server-${VERSION}.tar.gz"
          mv dist/send-ip-client.tar.gz "dist/send-ip-client-${VERSION}.tar.gz"
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: send-ip-${{ steps.meta.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/send-ip-server-${{ steps.meta.outputs.version }}.tar.gz
            dist/send-ip-client-${{ steps.meta.outputs.version }}.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true

      - name: Write job summary
        if: always()
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## ${TAG} (${JOB_STATUS})"
            echo
            echo "| Artifact | Description |"
            echo "|---|---|"
            echo "| send-ip-server-${VERSION}.tar.gz | Server side, extract to /opt/send-ip |"
            echo "| send-ip-client-${VERSION}.tar.gz | Client side, extract to /opt/send-ip-agent |"
            echo "| SHA256SUMS.txt | Checksums, verify with sha256sum -c |"
          } >> "$GITHUB_STEP_SUMMARY"
